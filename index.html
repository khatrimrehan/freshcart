<body>

 <div class="app">



  <!-- Header -->
  <header>
   <h1><img src="../assests/freshCart_logo.png" alt=""> FreshCart</h1>


  </header>

  <section class="search-box">

   <div class="input-box">
    <i class="ri-search-line"></i>
    <input id="input-field" type="text" placeholder="Add new item to list...">


    <div class="last">
     <div><input id="num" type="number" placeholder="0"></div>
     <div><button id="add-button">
       <i class="ri-add-line"></i>
      </button></div>
    </div>

   </div>

   <h5>FAVOURITE PICKS</h5>

   <div class="chips">




   </div>

  </section>





  <!-- List -->
  <section class="list">

   <div class="title">
    <h2>Your List</h2>
   </div>

   <div class="lists">

<div class="loading" id="loading">
          <div class="loader"></div>
    <span id="ld">Loading...</span>
</div>


  

   </div>

  </section>

 </div>

 <!-- Bottom Navigation -->
 
<nav>

    <a class="">
        <i class="ri-file-list-3-line"></i>
        <small>List</small>
    </a>

    <a>
        <i class="ri-price-tag-3-line"></i>
        <small>Frequent</small>
    </a>

    <a>
        <i class="ri-history-line"></i>
        <small>History</small>
    </a>

    <a>
        <i class="ri-settings-3-line"></i>

    </a>

</nav>
